<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Deadwood Trail social preview card</title>
  <desc id="desc">A haunted frontier terminal-style promo card for the Deadwood Trail game.</desc>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#28160f" />
      <stop offset="45%" stop-color="#140d0a" />
      <stop offset="100%" stop-color="#090909" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7c777" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#7b2315" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="panelGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29201a" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#120f0d" stop-opacity="0.98" />
    </linearGradient>
    <pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="3" fill="#000000" fill-opacity="0" />
      <rect y="3" width="6" height="3" fill="#f4dfbc" fill-opacity="0.025" />
    </pattern>
    <filter id="soften">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#sky)" />
  <circle cx="892" cy="260" r="132" fill="#c77f48" fill-opacity="0.12" filter="url(#soften)" />
  <circle cx="870" cy="282" r="98" fill="#f5c46d" fill-opacity="0.1" />
  <path d="M0 790 C210 740 278 642 430 652 C584 664 654 746 810 738 C926 732 1044 652 1200 620 L1200 1200 L0 1200 Z" fill="#18110d" />
  <path d="M0 836 C168 786 272 742 426 756 C544 768 648 832 786 834 C936 836 1068 762 1200 730 L1200 1200 L0 1200 Z" fill="#21170f" />
  <path d="M210 968 C356 910 482 858 622 872 C746 884 838 940 966 932" fill="none" stroke="#7d4e2a" stroke-opacity="0.5" stroke-width="10" stroke-linecap="round" />
  <path d="M282 1018 C404 976 518 938 636 946 C724 952 800 986 884 1006" fill="none" stroke="#e5aa5d" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 16" />

  <rect x="90" y="274" width="1020" height="540" rx="26" fill="url(#panelGlow)" stroke="#6a4830" stroke-width="2" />
  <rect x="90" y="274" width="1020" height="540" rx="26" fill="url(#glow)" />
  <rect x="90" y="274" width="1020" height="540" rx="26" fill="url(#scanlines)" />

  <text x="150" y="382" fill="#f4e1bf" font-family="'Courier New', 'Menlo', monospace" font-size="44" letter-spacing="4">DEADWOOD TRAIL</text>
  <text x="152" y="428" fill="#c98f60" font-family="'Courier New', 'Menlo', monospace" font-size="20" letter-spacing="5">HAUNTED CATTLE-DRIVE SURVIVAL</text>

  <rect x="150" y="468" width="720" height="234" rx="14" fill="#0d0d0d" fill-opacity="0.86" stroke="#6d4e37" stroke-width="2" />
  <text x="186" y="526" fill="#f3dfbc" font-family="'Courier New', 'Menlo', monospace" font-size="24">
    <tspan x="186" dy="0">STARTING FUNDS:  $900</tspan>
    <tspan x="186" dy="42">GOAL:  DRIVE 500 UNTAINTED CATTLE</tspan>
    <tspan x="186" dy="42">THREATS:  HUNGER, FEAR, BAD OMENS</tspan>
    <tspan x="186" dy="42">DESTINATION:  THE SILVER FOLD</tspan>
  </text>

  <text x="906" y="528" fill="#f3dfbc" font-family="'Courier New', 'Menlo', monospace" font-size="18" letter-spacing="3">STATUS</text>
  <rect x="906" y="548" width="150" height="18" rx="9" fill="#2f2118" />
  <rect x="906" y="548" width="110" height="18" rx="9" fill="#cb8c4d" />
  <text x="906" y="606" fill="#e7b26a" font-family="'Courier New', 'Menlo', monospace" font-size="24">MORALE  58</text>
  <text x="906" y="646" fill="#e7b26a" font-family="'Courier New', 'Menlo', monospace" font-size="24">SUPPLIES  LOW</text>
  <text x="906" y="686" fill="#e7b26a" font-family="'Courier New', 'Menlo', monospace" font-size="24">SANCTITY  HOLDING</text>

  <text x="150" y="758" fill="#f0d7a8" font-family="'Courier New', 'Menlo', monospace" font-size="26" letter-spacing="2">SURVIVE THE WEIRD WEST ONE DECISION AT A TIME.</text>
</svg>
